[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-router"
version = "0.3.0"
description = "Enterprise-grade Upstream Control Plane & Execution Governance Harness for LLMs & AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yarin", email = "yarin@example.com" }
]
keywords = [
    "ai-agent",
    "agentic-workflow",
    "router",
    "llm-orchestration",
    "guardrails",
    "circuit-breaker",
    "ast-security",
    "context-compression",
    "kv-cache",
    "speculative-decoding",
    "adaptive-rag",
    "agent-harness",
    "chaos-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
full = [
    "litellm>=1.30.0",
    "rich>=13.7.0",
]

[project.scripts]
adaptive-agent-router = "router_app.server.__main__:main"

[project.urls]
Homepage = "https://github.com/yarin0324/adaptive-agent-router"
Repository = "https://github.com/yarin0324/adaptive-agent-router.git"
Issues = "https://github.com/yarin0324/adaptive-agent-router/issues"
